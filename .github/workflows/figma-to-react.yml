name: Figma To React

on:
    workflow_dispatch:
        inputs:
            figma_url:
                description: Figma2RepoPoc component selection URL containing node-id
                required: true
                type: string

jobs:
    implement:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        container:
            image: node:24-bookworm
            # Let Bubblewrap create Codex's inner workspace-write sandbox.
            options: >-
                --cap-add=SYS_ADMIN
                --security-opt seccomp=unconfined
                --security-opt apparmor=unconfined
        environment: figma-ci
        concurrency:
            group: figma-mcp-credentials
            cancel-in-progress: false
        permissions:
            contents: write

        steps:
            - name: Install Git, GitHub CLI, and Bubblewrap
              run: |
                apt-get update
                apt-get install -y --no-install-recommends curl ca-certificates git bubblewrap

                mkdir -p -m 755 /etc/apt/keyrings
                curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                  -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
                chmod a+r /etc/apt/keyrings/githubcli-archive-keyring.gpg

                printf 'deb [arch=%s signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\n' \
                  "$(dpkg --print-architecture)" \
                  > /etc/apt/sources.list.d/github-cli.list

                apt-get update
                apt-get install -y --no-install-recommends gh
                gh --version

            - name: Set up pnpm
              run: |
                corepack enable pnpm
                corepack install --global pnpm@10.15.1

            - name: Clone the Repo
              env:
                GH_TOKEN: ${{ github.token }}
                SOURCE_REPOSITORY: ${{ github.repository }}
              run: |
                gh auth setup-git --hostname github.com
                git clone --branch main \
                    "https://github.com/${SOURCE_REPOSITORY}.git" \
                    "ui-workshop"
                git -C ui-workshop config user.name 'github-actions[bot]'
                git -C ui-workshop config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            - name: Install Dependencies
              working-directory: ui-workshop
              run: pnpm install --frozen-lockfile

            - name: Verify Codex sandbox and network
              env:
                CODEX_HOME: ${{ runner.temp }}/figma-codex
              working-directory: ui-workshop
              run: |
                mkdir -p "$CODEX_HOME"
                pnpm exec codex sandbox -c 'sandbox_mode="workspace-write"' \
                  -c 'sandbox_workspace_write.network_access=true' -- sh -eu -c '
                  test -r package.json
                  touch .codex-sandbox-check
                  rm .codex-sandbox-check
                  curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                    --output /dev/null https://mcp.figma.com/.well-known/oauth-protected-resource
                '

            - name: Restore Figma MCP credentials
              id: figma_auth
              env:
                FIGMA_MCP_CREDENTIALS: ${{ secrets.FIGMA_MCP_CREDENTIALS }}
                FIGMA_CREDENTIALS_WRITE_TOKEN: ${{ secrets.FIGMA_CREDENTIALS_WRITE_TOKEN }}
              working-directory: ui-workshop
              run: |
                # Keep persistence tooling outside the agent's writable checkout.
                install -m 500 scripts/figma-mcp-auth.mjs "$RUNNER_TEMP/figma-mcp-auth.mjs"
                node "$RUNNER_TEMP/figma-mcp-auth.mjs" restore --home "$RUNNER_TEMP/figma-codex"

            - name: Port Figma to React
              env:
                GH_TOKEN: ${{ github.token }}
                CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
                CODEX_HOME: ${{ runner.temp }}/figma-codex
                FIGMA_URL: ${{ inputs.figma_url }}
              working-directory: ui-workshop
              run: |
                if [ -z "$CODEX_API_KEY" ]; then
                  echo 'Set the CODEX_API_KEY repository secret before running this workflow.' >&2
                  exit 1
                fi
                node scripts/implement-design.mjs --figma-url "$FIGMA_URL"

            - name: Save refreshed Figma MCP credentials
              if: always() && steps.figma_auth.outcome == 'success'
              env:
                FIGMA_MCP_CREDENTIALS: ${{ secrets.FIGMA_MCP_CREDENTIALS }}
                FIGMA_CREDENTIALS_WRITE_TOKEN: ${{ secrets.FIGMA_CREDENTIALS_WRITE_TOKEN }}
              run: node "$RUNNER_TEMP/figma-mcp-auth.mjs" save --home "$RUNNER_TEMP/figma-codex"

            - name: Remove temporary Figma credentials
              if: always()
              run: rm -rf "$RUNNER_TEMP/figma-codex" "$RUNNER_TEMP/figma-mcp-auth.mjs"
